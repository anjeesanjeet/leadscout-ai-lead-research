<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeadScout: review leads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); height: calc(100vh - 61px); }
    .side { background: var(--paper); border-right: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
    .add { padding: 18px 20px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }
    .add input { font: inherit; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius-sm); }
    .add input:focus { outline: 2px solid var(--saffron); border-color: transparent; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--rule); }
    .filters button { background: var(--porcelain); color: var(--slate); border: 1px solid var(--rule); padding: 4px 10px; font-size: 13px; }
    .filters button[aria-pressed="true"] { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .list { overflow-y: auto; flex: 1; }
    .item { display: grid; grid-template-columns: 1fr auto; gap: 4px; padding: 12px 20px; border-bottom: 1px solid var(--mist); cursor: pointer; }
    .item:hover { background: var(--porcelain); }
    .item[aria-current="true"] { background: var(--mist); box-shadow: inset 3px 0 0 var(--indigo); }
    .item .co { font-weight: 700; }
    .item .score { font-family: var(--font-display); font-weight: 650; font-size: 18px; text-align: right; }
    .main { overflow-y: auto; padding: 26px 32px 60px; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
    .bigscore { font-family: var(--font-display); font-size: 56px; font-weight: 750; color: var(--indigo); line-height: 1; text-align: right; }
    .section { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius-lg); padding: 20px 22px; margin-top: 18px; }
    .section h2 { margin-bottom: 12px; }
    .crit { display: grid; grid-template-columns: 90px 1fr auto; gap: 12px; padding: 9px 0; border-top: 1px solid var(--mist); align-items: start; }
    .crit:first-of-type { border-top: 0; }
    .fact { padding: 8px 0; border-top: 1px solid var(--mist); display: grid; grid-template-columns: auto 1fr; gap: 10px; }
    .fact:first-of-type { border-top: 0; }
    .fact.blocked .claim { text-decoration: line-through; color: var(--slate); }
    .fact q { color: var(--slate); font-size: 13.5px; }
    label.f { display: block; font-weight: 700; font-size: 13.5px; margin: 10px 0 6px; }
    input.subject, textarea { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--rule); border-radius: var(--radius-sm); }
    textarea { min-height: 280px; resize: vertical; line-height: 1.55; }
    .checks { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
    .actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .actions .reject { background: var(--paper); color: var(--brick); border-color: var(--brick); }
    .trace { display: grid; grid-template-columns: auto 1fr auto auto; gap: 6px 14px; font-size: 13.5px; align-items: center; }
    .empty { color: var(--slate); margin: 40px auto; max-width: 420px; text-align: center; }
    .busy { color: var(--slate); font-size: 13.5px; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; height: auto; } .side { max-height: 60vh; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>LeadScout</strong><span class="muted">AI lead research and outreach</span></div>
    <nav class="nav">
      <a href="/review" aria-current="page">Review</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/flowchart">Flowcharts</a>
    </nav>
  </header>
  <main class="layout">
    <aside class="side">
      <form class="add" id="addForm">
        <strong>Research a company</strong>
        <input id="company" placeholder="Company name, e.g. Allbirds" required>
        <input id="website" placeholder="Website, e.g. allbirds.com" required>
        <button type="submit" id="runBtn">Research and draft</button>
        <span class="busy" id="busy" hidden>Reading the website, verifying facts and drafting. This takes 15 to 40 seconds.</span>
      </form>
      <div class="filters" id="filters"></div>
      <div class="list" id="list"></div>
    </aside>
    <section class="main" id="detail"><div class="empty">Pick a lead on the left, or research a new company.</div></section>
  </main>
  <script src="/static/js/review.js"></script>
</body>
</html>
